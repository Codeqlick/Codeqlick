<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Cruising</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #14101f;
        font-family:
          'IBM Plex Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 1rem;
        color: #5c5768;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.65rem 1.25rem;
        border-radius: 999px;
        background: #a80f5e;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #14101f;
        outline-offset: 2px;
      }
      hr {
        margin: 2rem auto;
        width: 4rem;
        border: 0;
        border-top: 1px solid #eee8ef;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/cruising-192.png" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>Cruising needs a connection to show the map and the spots. Check your connection and try again.</p>
      <a href="/map">Try again</a>
      <hr />
      <section lang="es">
        <h2 style="font-size: 1.2rem; margin: 0 0 0.5rem">No tienes conexión</h2>
        <p>Cruising necesita conexión para mostrar el mapa y los sitios. Comprueba tu conexión y vuelve a intentarlo.</p>
        <a href="/map">Volver a intentarlo</a>
      </section>
    </main>
  </body>
</html>
