name: E2E

# Browser tests of the key flows (codeqlick-frontend/e2e) against the whole stack built from this
# commit: Postgres, the site builder, the API and the production build of the website. The API
# writes every email it sends to E2E_MAIL_OUTBOX, where the tests read links (confirmations).
on:
  push:
    branches: [main]
    paths:
      - 'codeqlick-backend/**'
      - 'codeqlick-frontend/**'
      - 'codeqlick-sites/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'codeqlick-backend/**'
      - 'codeqlick-frontend/**'
      - 'codeqlick-sites/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codeqlick
          POSTGRES_PASSWORD: codeqlick
          POSTGRES_DB: codeqlick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeqlick -d codeqlick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_ADMIN_EMAIL: admin@codeqlick.test
      E2E_ADMIN_PASSWORD: e2e-admin-password-1
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:4000/v1
      E2E_MAIL_OUTBOX: ${{ github.workspace }}/outbox
      SITE_BUILDER_TOKEN: ci-builder-token
      UPLOADS_DIR: ${{ github.workspace }}/uploads
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            codeqlick-backend/package-lock.json
            codeqlick-frontend/package-lock.json
            codeqlick-sites/web-basica/package-lock.json

      # The website editor previews drafts through it (codeqlick-frontend/e2e/site-editor.spec.ts).
      - name: Start the site builder
        working-directory: codeqlick-sites
        run: |
          (cd web-basica && npm ci)
          mkdir -p "$RUNNER_TEMP/sites" "$UPLOADS_DIR"
          TEMPLATE_DIR=$PWD/web-basica SITES_DIR=$RUNNER_TEMP/sites \
            nohup node builder/server.mjs > ../builder.log 2>&1 &
          for i in $(seq 1 15); do curl -s -o /dev/null http://127.0.0.1:4100 && exit 0; sleep 1; done
          cat ../builder.log; exit 1

      - name: Start the API
        working-directory: codeqlick-backend
        env:
          # `test` only keeps emails from being sent.
          NODE_ENV: test
          PORT: '4000'
          DATABASE_URL: postgresql://codeqlick:codeqlick@localhost:5432/codeqlick
          JWT_ACCESS_SECRET: ci-dummy-secret-0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost:3000
          SITE_URL: http://localhost:3000
          SEED_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          SITE_BUILDER_URL: http://127.0.0.1:4100
          MAIL_OUTBOX_DIR: ${{ env.E2E_MAIL_OUTBOX }}
          LOG_LEVEL: warn
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
          npm run build
          nohup node dist/main.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/v1/health && exit 0; sleep 2; done
          cat ../api.log; exit 1

      - name: Build and start the website
        working-directory: codeqlick-frontend
        env:
          API_URL: http://localhost:4000/v1
          SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # The video chat test opens http://videochat.localhost:3000 (the API's default allowed
          # origin there) and its socket goes straight to the API (also allowed by the CSP).
          VIDEOCHAT_WS_URL: ws://localhost:4000/v1/videochat/ws
          # Same for the meetings, at http://meetings.localhost:3000.
          MEETINGS_WS_URL: ws://localhost:4000/v1/meetings/ws
        run: |
          npm ci
          npm run build
          cp -R public .next/standalone/ && cp -R .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > ../../../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/en && exit 0; sleep 2; done
          cat ../web.log; exit 1

      - name: Install Chromium
        working-directory: codeqlick-frontend
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: codeqlick-frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Keep the report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            codeqlick-frontend/playwright-report/
            codeqlick-frontend/test-results/
            api.log
            web.log
            builder.log
          retention-days: 7
