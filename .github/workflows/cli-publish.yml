name: CLI publish

# Publishes @codeqlick/cli to npm when a tag cli-v<version> is pushed (the version must be the one
# in codeqlick-cli/package.json). npm's Trusted Publishing: GitHub's OIDC token proves the run,
# so there is no npm token or 2FA code anywhere. Configured on npmjs.com for this file.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: cli-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeqlick-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package's version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "cli-v${version}" ] ||
            { echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --ignore-scripts
