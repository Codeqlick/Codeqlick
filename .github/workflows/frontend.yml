name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'codeqlick-frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'codeqlick-frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: codeqlick-frontend

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # No API in CI: public pages fetch content at request time and tolerate an unreachable API.
      API_URL: http://localhost:4000/v1
      SITE_URL: https://codeqlick.com
      NEXT_PUBLIC_SITE_URL: https://codeqlick.com
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codeqlick-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
