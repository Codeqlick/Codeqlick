# Production stack for the VPS (see deploy/README.md):
#   docker compose -f docker-compose.prod.yml up -d --build
# Settings come from a `.env` file next to this one (template: deploy/.env.example).
# Nothing is exposed publicly: api and web listen on 127.0.0.1 and the host's Nginx proxies to them.
name: codeqlick-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeqlick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codeqlick
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeqlick -d codeqlick"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Dumps the database and copies the uploaded images to ./backups once a day (see
  # deploy/README.md, "Backups").
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The owner of the dump files on the host: set it to the deploy user (`id -u`:`id -g`).
    user: ${BACKUP_USER:-1000:1000}
    environment:
      PGHOST: db
      PGUSER: codeqlick
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: codeqlick
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads-data:/uploads:ro
    entrypoint: ["/usr/local/bin/backup.sh"]
    # Unhealthy when the newest dump is older than two days.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'codeqlick-*.dump' -mmin -2880 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 2m
      start_interval: 10s

  api:
    build: ./codeqlick-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://codeqlick:${POSTGRES_PASSWORD}@db:5432/codeqlick
      CORS_ORIGINS: ${SITE_URL:?set SITE_URL in .env}
      SITE_URL: ${SITE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:?set CREDENTIALS_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Codeqlick <hello@codeqlick.com>}
      LEADS_NOTIFY_TO: ${LEADS_NOTIFY_TO:-hello@codeqlick.com}
      # Admins must turn on two-step verification before they can use the admin panel.
      ADMIN_TWO_FACTOR_REQUIRED: ${ADMIN_TWO_FACTOR_REQUIRED:-true}
      # Visit numbers on the admin dashboard, read from Umami with its dashboard account.
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-}
      # Managed client sites: built by site-builder, previews at <slug>.demo.codeqlick.com.
      SITE_BUILDER_URL: http://site-builder:4100
      SITE_BUILDER_TOKEN: ${SITE_BUILDER_TOKEN}
      SITES_PREVIEW_DOMAIN: ${SITES_PREVIEW_DOMAIN:-demo.codeqlick.com}
      # Client domains: what they must point at, and OVH's API as their technical contact.
      SITES_SERVER_IP: ${SITES_SERVER_IP:-}
      # Buying a preview online (architecture 8.2, decision 20): off without both keys.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CLOUD_PRO_PRICE_ID: ${STRIPE_CLOUD_PRO_PRICE_ID:-}
      SITE_PRICE_CENTS: ${SITE_PRICE_CENTS:-20000}
      SITE_VAT_PERCENT: ${SITE_VAT_PERCENT:-21}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      OVH_NIC_HANDLE: ${OVH_NIC_HANDLE:-}
      # Video chat (architecture 4.7): the page allowed to open its WebSocket, coturn's shared
      # secret and the STUN/TURN URLs browsers get. Without TURN, calls behind strict NATs fail.
      VIDEOCHAT_ORIGINS: ${VIDEOCHAT_URL:-https://videochat.codeqlick.com}
      # Meetings (architecture 4.8): the page allowed to open its WebSocket (same TURN as above).
      MEETINGS_ORIGINS: ${MEETINGS_URL:-https://meetings.codeqlick.com}
      VIDEOCHAT_AGE_VERIFICATION_REQUIRED: ${VIDEOCHAT_AGE_VERIFICATION_REQUIRED:-false}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      # "Someone is waiting" notifications (Web Push); off while the keys are empty.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Cloudflare Turnstile on sign-up and sign-in (architecture 4.3); off while empty.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Codeqlick Cloud (architecture 4.13, 8.3): deploying is off until deploy/setup-cloud.sh
      # sets the hosting domain. Its files live on the host, where Nginx serves them.
      CLOUD_HOSTING_DOMAIN: ${CLOUD_HOSTING_DOMAIN:-}
      # The one exception to refusing codeqlick.com domains (architecture 4.13): off while empty.
      CLOUD_PLATFORM_DOMAINS: ${CLOUD_PLATFORM_DOMAINS:-}
      CLOUD_PLATFORM_TEAM_ID: ${CLOUD_PLATFORM_TEAM_ID:-}
      CLOUD_ROOT: /cloud
      CLOUD_URL: ${CLOUD_URL:-https://cloud.codeqlick.com}
      # Builds from Git (architecture 4.13, 8.4): off until the GitHub App's settings are set.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      CLOUD_BUILDER_TOKEN: ${CLOUD_BUILDER_TOKEN:-}
      # Managed databases (architecture 4.13 "Databases"): off while CLOUD_PG_HOST is empty.
      CLOUD_PG_ADMIN_URL: postgresql://cqadmin:${CLOUD_PG_PASSWORD:-}@cloud-pg:5432/postgres
      CLOUD_PG_HOST: ${CLOUD_PG_HOST:-}
      # Object storage (architecture 4.13 "Object storage"): off while CLOUD_STORAGE_ENDPOINT is empty.
      CLOUD_STORAGE_ADMIN_URL: http://cloud-storage:3903
      CLOUD_STORAGE_ADMIN_TOKEN: ${CLOUD_STORAGE_ADMIN_TOKEN:-}
      CLOUD_STORAGE_ENDPOINT: ${CLOUD_STORAGE_ENDPOINT:-}
      CLOUD_STORAGE_CAPACITY_GB: ${CLOUD_STORAGE_CAPACITY_GB:-100}
    volumes:
      - uploads-data:/app/uploads
      - /srv/codeqlick/cloud:/cloud
      # Swipe's photos: private, served only through the API (architecture 4.10).
      - swipe-data:/app/swipe-uploads
    ports:
      - "127.0.0.1:${API_PORT:-4010}:4000"

  web:
    build:
      context: ./codeqlick-frontend
      # Statically rendered pages are built with the tracker tag, so it needs these at build time.
      args:
        UMAMI_URL: http://umami:3000
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        LEGAL_OWNER_NAME: ${LEGAL_OWNER_NAME:-}
        LEGAL_OWNER_TAX_ID: ${LEGAL_OWNER_TAX_ID:-}
        LEGAL_OWNER_ADDRESS: ${LEGAL_OWNER_ADDRESS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side calls stay inside the Docker network.
      API_URL: http://api:4000/v1
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      # Analytics: the site proxies the tracker to Umami (see "Analytics" in deploy/README.md).
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Codeqlick Cloud's hosting domain, shown in its docs (architecture 4.13).
      CLOUD_HOSTING_DOMAIN: ${CLOUD_HOSTING_DOMAIN:-codeqlick.app}
      # The public documentation site (architecture 6.3); empty: the console's own /docs.
      CLOUD_DOCS_URL: ${CLOUD_DOCS_URL:-}
      # Legal notice and privacy policy: hidden until LEGAL_OWNER_NAME is set.
      LEGAL_OWNER_NAME: ${LEGAL_OWNER_NAME:-}
      LEGAL_OWNER_TAX_ID: ${LEGAL_OWNER_TAX_ID:-}
      LEGAL_OWNER_ADDRESS: ${LEGAL_OWNER_ADDRESS:-}
      # Cloudflare Turnstile's public site key: the sign-in and sign-up widget; off while empty.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"

  # STUN/TURN for the video chat (architecture 4.7): relays a call's media when the two browsers
  # can't reach each other directly. Host network (it needs a public UDP port range); credentials
  # are short-lived HMACs of TURN_SECRET made by the API. Firewall: 3478/udp+tcp and the range.
  # Off until the video chat is set up: deploy/setup-videochat.sh adds COMPOSE_PROFILES=videochat
  # to .env, so a release before that (no TURN_SECRET yet) doesn't fail.
  coturn:
    image: coturn/coturn:4.18.0-alpine
    profiles: [videochat]
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --external-ip=${SITES_SERVER_IP:-}
      - --realm=videochat.codeqlick.com
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --min-port=49160
      - --max-port=49400
      - --fingerprint
      - --no-cli
      - --no-tls
      # DTLS listeners are off by default since coturn 4.18 (the old --no-dtls flag is gone).
      - --no-multicast-peers
      # Never relay to the server itself or private networks (no SSRF through TURN).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=${SITES_SERVER_IP:-127.0.0.1}
      - --user-quota=12
      - --total-quota=1200
      - --log-file=stdout

  # Builds the managed client sites (codeqlick-sites) into /srv/codeqlick/sites/<slug>, where the
  # host's Nginx serves them. Internal only: the API calls it inside the Docker network. It runs as
  # the deploy user so the releases it writes belong to them (deploy/sites/sync-sites.sh).
  site-builder:
    build: ./codeqlick-sites
    restart: unless-stopped
    user: "${SITES_USER:?set SITES_USER in .env (the deploy user's uid:gid)}"
    environment:
      SITE_BUILDER_TOKEN: ${SITE_BUILDER_TOKEN:?set SITE_BUILDER_TOKEN in .env}
      SITES_DIR: /srv/codeqlick/sites
      UPLOADS_DIR: /uploads
    volumes:
      - /srv/codeqlick/sites:/srv/codeqlick/sites
      - uploads-data:/uploads:ro

  # Cookieless analytics (Umami), with its own database. The site reaches it inside the Docker
  # network; its dashboard listens on 127.0.0.1 only (Nginx site or an SSH tunnel).
  umami-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
      POSTGRES_DB: umami
    volumes:
      - umami-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 3s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3020}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat > /dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 1m

  # Codeqlick Cloud's managed databases (architecture 4.13 "Databases", decision 47): a
  # PostgreSQL apart from the platform's, open on 5432 with TLS only (deploy/cloud-pg). Started
  # with the `cloud-data` profile (COMPOSE_PROFILES=cloud-data in .env); steps in deploy/README.md.
  cloud-pg:
    image: postgres:18-alpine
    profiles: [cloud-data]
    restart: unless-stopped
    environment:
      POSTGRES_USER: cqadmin
      POSTGRES_PASSWORD: ${CLOUD_PG_PASSWORD:-}
      POSTGRES_DB: postgres
      CLOUD_HOSTING_DOMAIN: ${CLOUD_HOSTING_DOMAIN:-codeqlick.app}
    ports:
      - "5432:5432"
    volumes:
      - cloud-pg-data:/var/lib/postgresql
      - ./deploy/cloud-pg/entrypoint.sh:/usr/local/bin/cloud-pg-entrypoint.sh:ro
      - ./deploy/cloud-pg/pg_hba.conf:/etc/cloud-pg/pg_hba.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    entrypoint: ["/usr/local/bin/cloud-pg-entrypoint.sh"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqadmin -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Dumps every Cloud database daily to ./backups/cloud-pg, 7 days kept.
  cloud-pg-backup:
    image: postgres:18-alpine
    profiles: [cloud-data]
    restart: unless-stopped
    depends_on:
      cloud-pg:
        condition: service_healthy
    user: ${BACKUP_USER:-1000:1000}
    environment:
      PGHOST: cloud-pg
      PGUSER: cqadmin
      PGPASSWORD: ${CLOUD_PG_PASSWORD:-}
      CLOUD_PG_KEEP_DAYS: ${CLOUD_PG_KEEP_DAYS:-7}
    volumes:
      - ./deploy/cloud-pg/backup.sh:/usr/local/bin/cloud-pg-backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/usr/local/bin/cloud-pg-backup.sh"]

  # Codeqlick Cloud's object storage (architecture 4.13 "Object storage", decision 48): Garage,
  # its S3 API on 127.0.0.1:3900 behind Nginx at s3.<hosting domain> (deploy/setup-storage.sh);
  # its admin API only inside Docker. Started with the `cloud-data` profile.
  cloud-storage:
    image: dxflrs/garage:v2.5.0
    profiles: [cloud-data]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${CLOUD_STORAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${CLOUD_STORAGE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./deploy/cloud-storage/garage.toml:/etc/garage.toml:ro
      - cloud-storage-meta:/var/lib/garage/meta
      - cloud-storage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
  # Images uploaded from the admin panel.
  uploads-data:
  # Swipe's photos (not in the public uploads, not in the backups).
  swipe-data:
  umami-db-data:
  cloud-pg-data:
  cloud-storage-meta:
  cloud-storage-data:
