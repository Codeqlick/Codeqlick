# cloud-pg's access rules (architecture 4.13 "Databases", decision 47).
# TYPE    DATABASE  USER     ADDRESS        METHOD
# Inside the container (health check, the image's set-up).
local     all       cqadmin                 trust
# The administrator: only from Docker's networks (the API and the backup service).
host      all       cqadmin  172.16.0.0/12  scram-sha-256
host      all       cqadmin  192.168.0.0/16 scram-sha-256
# Teams: over TLS only, each role only to the database of its name.
hostssl   sameuser  all      0.0.0.0/0      scram-sha-256
hostssl   sameuser  all      ::/0           scram-sha-256
