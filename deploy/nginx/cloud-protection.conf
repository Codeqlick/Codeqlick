# Password protection of Codeqlick Cloud's addresses (architecture 4.13 "Password protection", 8.3,
# decision 50). Installed by deploy/setup-cloud.sh as /etc/nginx/snippets/cq-cloud-protection.conf
# (with the checkout's path and API_PORT written in) and included inside the server block of the
# hosting site and of every `cq-site ... cloud` site, after each sets $cq_slug and $cq_kind
# (`previews` or `production`).
#
# Needs, at Nginx's http level (deploy/nginx/cloud-hosting.conf.template): the map that gives
# $cq_access (the visitor's __Host-cq_access cookie), `proxy_cache_path ... keys_zone=cq_protect`
# and `limit_req_zone ... zone=cq_cloud_password`; the key file /etc/nginx/cq-cloud-protection-key.conf
# (root, 600: one `proxy_set_header X-Cq-Protection-Key "...";`); and ngx_http_auth_request_module
# (built into Debian's and Ubuntu's nginx).
#
# Every request of the site asks /__cq_check first. Without the marker file
# cloud/protect/<slug>.<kind> it answers 204 at once and never reaches the API; with it, the API
# answers 204 (let through) or 401 (sent to the password page). Locations of the including site
# inherit `auth_request` and `error_page 401` as long as they don't set their own `error_page`;
# Codeqlick's own pages (missing, suspended, not found) turn it off. A 451 or 410 is returned in the
# rewrite phase, before the check, so suspended and missing sites keep their pages.

auth_request /__cq_check;
error_page 401 = @cq_login;

# No access yet: the password page, back to the same path and query afterwards. Nginx can't encode
# the query, so $request_uri goes as is and the API takes everything after the first `next=`.
location @cq_login {
    auth_request off;
    return 302 https://$host/__codeqlick/password?next=$request_uri;
}

location = /__cq_check {
    internal;
    auth_request off;

    # Unprotected (the usual case): answered from the file check alone.
    if (!-f /srv/codeqlick/cloud/protect/$cq_slug.$cq_kind) {
        return 204;
    }

    proxy_pass http://127.0.0.1:4010/v1/cloud/protection/check; # API_PORT
    # Always a bodiless GET, whatever the visitor's request was, and only the headers below: the
    # site's other cookies and the visitor's headers never reach the API.
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Cq-Host $host;
    proxy_set_header X-Cq-Project $cq_slug;
    proxy_set_header X-Cq-Kind $cq_kind;
    proxy_set_header X-Cq-Access $cq_access;
    include /etc/nginx/cq-cloud-protection-key.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    # One answer per address and cookie value for 60 s, so a page with many files asks once. The
    # visitor's method is what proxy_cache_methods sees (POST included: the answer doesn't depend
    # on it). The API's own caching headers are ignored.
    proxy_cache cq_protect;
    proxy_cache_key "$host|$cq_access";
    proxy_cache_methods GET HEAD POST;
    proxy_cache_valid 204 401 60s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
}

# The visitor's side (password page, team members' tickets), answered by the API on every hosting
# address, so this path of a project's own files is never served. The page's CSP and the API's other
# headers pass through, except HSTS and X-Robots-Tag: this location's add_header stops the site's
# from being inherited, so it sets them itself (helmet's HSTS has includeSubDomains, which must never
# reach a client's own domain).
location ^~ /__codeqlick/ {
    auth_request off;
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:4010/v1/cloud/protection/; # API_PORT
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API trusts exactly one proxy hop and rate-limits on the address appended here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header X-Cq-Host $host;
    proxy_set_header X-Cq-Project $cq_slug;
    proxy_set_header X-Cq-Kind $cq_kind;
    proxy_set_header X-Cq-Access $cq_access;
    include /etc/nginx/cq-cloud-protection-key.conf;

    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag noindex always;

    # Password tries: 10 requests a minute per IP (the API also allows 5 tries a minute per IP and
    # project). This location's limit replaces the site's per-host one.
    location = /__codeqlick/password {
        limit_req zone=cq_cloud_password burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4010/v1/cloud/protection/password; # API_PORT
    }
}
