# Password protection of Codeqlick Cloud's addresses (architecture 4.13 "Password protection", 8.3,
# decision 50). Installed by deploy/setup-cloud.sh as /etc/nginx/snippets/cq-cloud-protection.conf
# (with the checkout's path and API_PORT written in) and included inside the server block of the
# hosting site and of every `cq-site ... cloud` site, after each sets $cq_slug and $cq_kind
# (`previews` or `production`).
#
# Needs, at Nginx's http level (deploy/nginx/cloud-hosting.conf.template): the map that gives
# $cq_access (the visitor's __Host-cq_access cookie), `proxy_cache_path ... keys_zone=cq_protect`
# and `limit_req_zone ... zone=cq_cloud_password`; the key file /etc/nginx/cq-cloud-protection-key.conf
# (root, 600: one `proxy_set_header X-Cq-Protection-Key "...";`); and ngx_http_auth_request_module
# (built into Debian's and Ubuntu's nginx).
#
# Also needs, at the http level of the hosting site: `map $realpath_root $cq_deploy`, and
# `map $cq_path_raw $cq_path` (architecture 4.13 "Redirects, rewrites and headers", decision 52);
# the including site's content locations use `try_files $cq_path ...`, and it includes
# /etc/nginx/snippets/cq-cloud-rule-headers.conf (deploy/nginx/cloud-rule-headers.conf) at server
# level and inside every location that has add_header of its own.
#
# Every request of the site asks /__cq_check first. When neither the marker file
# cloud/protect/<slug>.<kind> nor the deployment's .cq-rules exists it answers 204 at once and never
# reaches the API; otherwise the API answers 204 (let through, with the file to serve and the
# headers to add), 401 (sent to the password page) or 403 (a redirect, or a wrong key). Locations of
# the including site inherit `auth_request` and the `error_page`s as long as they don't set their
# own `error_page`; Codeqlick's own pages (missing, suspended, not found) turn it off. A 451 or 410
# is returned in the rewrite phase, before the check, so suspended and missing sites keep their pages.
#
# Nginx's phases matter here: the variables of `auth_request_set` exist from the access phase on
# (try_files, add_header, error_page's named locations) but never in a rewrite-phase `if` of the
# same request, and the `set`s below run in the rewrite phase, before the subrequest.

auth_request /__cq_check;
error_page 401 = @cq_login;
error_page 403 = @cq_redirect;

# The main request's path and query, for the check: inside the subrequest $uri is /__cq_check.
# Variables are shared with the subrequest. $uri is decoded; the check refuses control characters in
# it (below), so it can't inject headers.
set $cq_uri $uri;
set $cq_args $args;

# What the API answered (empty when the check answered 204 on its own).
auth_request_set $cq_status $upstream_http_x_cq_status;
auth_request_set $cq_location $upstream_http_x_cq_location;
auth_request_set $cq_path_raw $upstream_http_x_cq_path;
# The headers a rule may add: the fixed list of the API (architecture 4.13 "Allowed headers"); keep
# it in step with cloud-rule-headers.conf.
auth_request_set $cq_h_content_security_policy $upstream_http_x_cq_h_content_security_policy;
auth_request_set $cq_h_content_security_policy_report_only $upstream_http_x_cq_h_content_security_policy_report_only;
auth_request_set $cq_h_cache_control $upstream_http_x_cq_h_cache_control;
auth_request_set $cq_h_permissions_policy $upstream_http_x_cq_h_permissions_policy;
auth_request_set $cq_h_x_frame_options $upstream_http_x_cq_h_x_frame_options;
auth_request_set $cq_h_cross_origin_opener_policy $upstream_http_x_cq_h_cross_origin_opener_policy;
auth_request_set $cq_h_cross_origin_embedder_policy $upstream_http_x_cq_h_cross_origin_embedder_policy;
auth_request_set $cq_h_cross_origin_resource_policy $upstream_http_x_cq_h_cross_origin_resource_policy;
auth_request_set $cq_h_access_control_allow_origin $upstream_http_x_cq_h_access_control_allow_origin;
auth_request_set $cq_h_access_control_allow_methods $upstream_http_x_cq_h_access_control_allow_methods;
auth_request_set $cq_h_access_control_allow_headers $upstream_http_x_cq_h_access_control_allow_headers;
auth_request_set $cq_h_link $upstream_http_x_cq_h_link;
auth_request_set $cq_h_x_robots_tag $upstream_http_x_cq_h_x_robots_tag;
auth_request_set $cq_h_content_language $upstream_http_x_cq_h_content_language;

# A redirect decided by the API (403 with X-Cq-Status and X-Cq-Location). This runs after the access
# phase, so the variables above are set. Any other 403 (a wrong key, a folder without index) stays 403.
location @cq_redirect {
    auth_request off;
    if ($cq_status = 301) { return 301 $cq_location; }
    if ($cq_status = 302) { return 302 $cq_location; }
    if ($cq_status = 307) { return 307 $cq_location; }
    if ($cq_status = 308) { return 308 $cq_location; }
    return 403;
}

# No access yet: the password page, back to the same path and query afterwards. Nginx can't encode
# the query, so $request_uri goes as is and the API takes everything after the first `next=`.
location @cq_login {
    auth_request off;
    return 302 https://$host/__codeqlick/password?next=$request_uri;
}

location = /__cq_check {
    internal;
    auth_request off;

    # Neither protected nor with rules (the usual case): answered from two file checks, with no call
    # to the API. Nginx's `if` can't AND or OR, so flags are set. The tests use $document_root (the
    # link hosts/<label> is followed by -f and -d), never $realpath_root, which fails the request
    # when the link is dangling; the deployment's id is only taken from $realpath_root when the
    # folder exists.
    set $cq_need 0;
    set $cq_dep "";
    set $cq_key "$host|$cq_access";
    if (-f /srv/codeqlick/cloud/protect/$cq_slug.$cq_kind) {
        set $cq_need 1;
    }
    if (-d $document_root) {
        set $cq_dep $cq_deploy;
    }
    # With rules the answer depends on the path too (the protection alone: on the cookie only).
    if (-f $document_root/.cq-rules) {
        set $cq_need 1;
        set $cq_key "$host|$cq_access|$cq_dep|$request_uri";
    }
    if ($cq_need = 0) {
        return 204;
    }
    # A decoded path with control characters (%0d%0a) would inject headers into the call below.
    if ($cq_uri ~ "[[:cntrl:]]") {
        return 403;
    }

    proxy_pass http://127.0.0.1:4010/v1/cloud/edge/check; # API_PORT
    # Always a bodiless GET, whatever the visitor's request was, and only the headers below: the
    # site's other cookies and the visitor's headers never reach the API.
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Cq-Host $host;
    proxy_set_header X-Cq-Project $cq_slug;
    proxy_set_header X-Cq-Kind $cq_kind;
    proxy_set_header X-Cq-Access $cq_access;
    proxy_set_header X-Cq-Deployment $cq_dep;
    proxy_set_header X-Cq-Uri $cq_uri;
    proxy_set_header X-Cq-Args $cq_args;
    include /etc/nginx/cq-cloud-protection-key.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    # One answer per address and cookie value (with rules: and URL) for 60 s, so a page with many
    # files asks once. The visitor's method is what proxy_cache_methods sees (POST included: the
    # answer doesn't depend on it). The API's own caching headers are ignored. The answer's X-Cq-*
    # headers are cached with it. 403 is the redirects' answer.
    proxy_cache cq_protect;
    proxy_cache_key $cq_key;
    proxy_cache_methods GET HEAD POST;
    proxy_cache_valid 204 401 403 60s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
}

# The visitor's side (password page, team members' tickets), answered by the API on every hosting
# address, so this path of a project's own files is never served. The page's CSP and the API's other
# headers pass through, except HSTS and X-Robots-Tag: this location's add_header stops the site's
# from being inherited, so it sets them itself (helmet's HSTS has includeSubDomains, which must never
# reach a client's own domain).
location ^~ /__codeqlick/ {
    auth_request off;
    client_max_body_size 16k;

    proxy_pass http://127.0.0.1:4010/v1/cloud/protection/; # API_PORT
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API trusts exactly one proxy hop and rate-limits on the address appended here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header X-Cq-Host $host;
    proxy_set_header X-Cq-Project $cq_slug;
    proxy_set_header X-Cq-Kind $cq_kind;
    proxy_set_header X-Cq-Access $cq_access;
    include /etc/nginx/cq-cloud-protection-key.conf;

    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag noindex always;

    # Password tries: 10 requests a minute per IP (the API also allows 5 tries a minute per IP and
    # project). This location's limit replaces the site's per-host one.
    location = /__codeqlick/password {
        limit_req zone=cq_cloud_password burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4010/v1/cloud/protection/password; # API_PORT
    }
}
