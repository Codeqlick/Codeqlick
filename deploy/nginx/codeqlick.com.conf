# Website. HTTP only on purpose: `certbot --nginx` adds the TLS listener and the redirect.
# Install as /etc/nginx/sites-available/codeqlick.com.conf (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name www.codeqlick.com;
    return 301 https://codeqlick.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name codeqlick.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000; # WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The web app forwards X-Real-IP to the API so rate limits apply per visitor.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
