# Staging (docker-compose.staging.yml). HTTP only on purpose: `certbot --nginx` adds the TLS
# listener and the redirect. Install as /etc/nginx/sites-available/staging.codeqlick.com.conf (see
# deploy/README.md, "Staging"). The whole site asks for the team's password and is never indexed.

server {
    listen 80;
    listen [::]:80;
    server_name staging.codeqlick.com;
    # HTTP/2 on the TLS listener certbot adds (nginx >= 1.25).
    http2 on;

    auth_basic "Codeqlick staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 26m;

    # Every email staging sends (Mailpit's inbox).
    location /mail/ {
        proxy_pass http://127.0.0.1:8026; # MAILPIT_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3011; # WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
