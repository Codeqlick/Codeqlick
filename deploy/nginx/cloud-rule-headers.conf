# Headers a deployment's codeqlick.json may add (architecture 4.13 "Redirects, rewrites and
# headers", 8.3, decision 52). Installed by deploy/setup-cloud.sh as
# /etc/nginx/snippets/cq-cloud-rule-headers.conf.
#
# The edge check (deploy/nginx/cloud-protection.conf) copies the API's X-Cq-H-<name> answers into
# $cq_h_<name>; an empty variable adds no header. The list is fixed (Nginx must know the names) and
# is the API's list of allowed headers: change both together.
#
# add_header is inherited only by a location that has none of its own, so include this file at
# server level AND inside every location that repeats the site's security headers (the hosting
# site's hashed-assets location). Never in Codeqlick's own locations (/__codeqlick/, the pages).
add_header Content-Security-Policy $cq_h_content_security_policy always;
add_header Content-Security-Policy-Report-Only $cq_h_content_security_policy_report_only always;
add_header Cache-Control $cq_h_cache_control always;
add_header Permissions-Policy $cq_h_permissions_policy always;
add_header X-Frame-Options $cq_h_x_frame_options always;
add_header Cross-Origin-Opener-Policy $cq_h_cross_origin_opener_policy always;
add_header Cross-Origin-Embedder-Policy $cq_h_cross_origin_embedder_policy always;
add_header Cross-Origin-Resource-Policy $cq_h_cross_origin_resource_policy always;
add_header Access-Control-Allow-Origin $cq_h_access_control_allow_origin always;
add_header Access-Control-Allow-Methods $cq_h_access_control_allow_methods always;
add_header Access-Control-Allow-Headers $cq_h_access_control_allow_headers always;
add_header Link $cq_h_link always;
add_header X-Robots-Tag $cq_h_x_robots_tag always;
add_header Content-Language $cq_h_content_language always;
