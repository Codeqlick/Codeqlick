# Meetings (architecture 4.8, 6.3): the website app serves its pages; /ws is the API's signaling
# WebSocket. HTTP only on purpose: `certbot --nginx -d meetings.codeqlick.com` adds the TLS
# listener and the redirect. Install as /etc/nginx/sites-available/meetings.codeqlick.com.conf.

map $http_upgrade $meetings_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name meetings.codeqlick.com;
    # HTTP/2 on the TLS listener certbot adds (nginx >= 1.25).
    http2 on;

    client_max_body_size 1m;

    # Signaling WebSocket → API (/v1/meetings/ws). Calls last long: keep the socket open; the
    # API pings every 30 s.
    location = /ws {
        proxy_pass http://127.0.0.1:4010/v1/meetings/ws; # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meetings_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010; # WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
