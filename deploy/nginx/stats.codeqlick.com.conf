# Umami's dashboard (analytics). HTTP only on purpose: `certbot --nginx` adds the TLS listener and
# the redirect. Install as /etc/nginx/sites-available/stats.codeqlick.com.conf (see deploy/README.md).
# The site's own tracker doesn't come through here: it goes through codeqlick.com/api/stats.

server {
    listen 80;
    listen [::]:80;
    server_name stats.codeqlick.com;

    # Not for search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3020; # UMAMI_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
