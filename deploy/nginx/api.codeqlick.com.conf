# API. HTTP only on purpose: `certbot --nginx` adds the TLS listener and the redirect.
# Install as /etc/nginx/sites-available/api.codeqlick.com.conf (see deploy/README.md).

# Deploy hooks (architecture 4.13): the token is part of the URL, so the access log keeps only its
# first 8 characters after cqd_.
map $request $cq_api_request {
    "~^(?<cq_before>.*/v1/cloud/hooks/cqd_[A-Za-z0-9_-]{8})[A-Za-z0-9_-]*(?<cq_after>.*)$" "$cq_before...$cq_after";
    default $request;
}
log_format cq_api '$remote_addr - $remote_user [$time_local] "$cq_api_request" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name api.codeqlick.com;
    # HTTP/2 on the TLS listener certbot adds (nginx >= 1.25).
    http2 on;

    client_max_body_size 2m;
    access_log /var/log/nginx/access.log cq_api;

    # Codeqlick Cloud's deployments: a built folder as tar.gz, up to 50 MB (architecture 4.13).
    location ~ ^/v1/cloud/projects/[^/]+/deployments$ {
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:4010; # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Codeqlick Cloud's password protection (architecture 4.13, 8.3): only the hosting sites' Nginx
    # calls these routes, on 127.0.0.1; never through the API's public address. Case-insensitive,
    # like the API's routing.
    location ~* ^/v1/cloud/protection(?:/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4010; # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API trusts exactly one proxy hop and rate-limits on the address appended here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
