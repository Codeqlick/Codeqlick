# API. HTTP only on purpose: `certbot --nginx` adds the TLS listener and the redirect.
# Install as /etc/nginx/sites-available/api.codeqlick.com.conf (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.codeqlick.com;
    # HTTP/2 on the TLS listener certbot adds (nginx >= 1.25).
    http2 on;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4010; # API_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API trusts exactly one proxy hop and rate-limits on the address appended here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
